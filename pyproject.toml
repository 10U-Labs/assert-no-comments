[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "setuptools-scm>=8.0"]

[project]
name = "assert-no-comments"
description = "CLI tool to assert that nothing in a tree carries a comment or a docstring"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "10U Labs", email = "dev@10ulabs.com" }]
readme = "README.md"
dependencies = [
    "pyyaml>=6.0",
    "tree-sitter>=0.25",
    "tree-sitter-hcl>=1.2",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dynamic = ["version"]

[project.scripts]
assert-no-comments = "assert_no_comments.cli:main"

[project.urls]
Homepage = "https://github.com/10U-Labs/assert-no-comments"
Repository = "https://github.com/10U-Labs/assert-no-comments"

[tool.setuptools_scm]

[tool.setuptools.packages.find]
where = ["src"]
